<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- context: serif monogram — a record of you. c in Georgia, blue period. -->
  <defs>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#faf6ec"/>
    <text x="490" y="760" font-family="Georgia, 'Times New Roman', serif"
          font-size="820" font-weight="700" text-anchor="middle"
          fill="#2b2620">c</text>
    <circle cx="770" cy="702" r="58" fill="#0a7bf5"/>
  </g>
</svg>
